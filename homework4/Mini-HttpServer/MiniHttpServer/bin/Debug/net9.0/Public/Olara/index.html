<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in — Olara</title>

 
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="assets/css/login.css">
  <meta name="color-scheme" content="light dark">
</head>
<body>
  <div class="page" role="application">
    <section class="left" aria-label="Sign in panel">
      <a class="logo" href="/" aria-label="Olara home">
    
    
        <svg xmlns="http://www.w3.org/2000/svg" width="153" height="39" viewBox="0 0 153 39" fill="none" aria-hidden="true" focusable="false">
         
        </svg>
      </a>

      <div class="signin">
        <header class="account">
          <h1>Sign in</h1>
          <p class="hint">Don’t have an account? <a href="#" rel="noopener">Create now</a></p>
        </header>

        <form class="form" method="post" action="/auth" autocomplete="off" novalidate>
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="example@gmail.com"
            inputmode="email"
            autocomplete="username"
            spellcheck="false"
            required
            aria-required="true"
          >

          <label for="password">Password</label>
          <div class="row password-row">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="@#*%"
              autocomplete="current-password"
              required
              aria-required="true"
            />
            <button type="button" class="eye" aria-label="Toggle password visibility">
        
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
